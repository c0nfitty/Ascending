[project]
name = "maplerugs"
version = "0.1.0"
description = "Maple Rugs AI description and semantic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.136.1",
    "strands-agents>=0.1.0",
    "pydantic-settings>=2.14.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.poe.tasks]
start = "python main.py"
lint = "ruff check src"
format = "ruff format src"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maplerugs"]

[dependency-groups]
dev = [
    "poethepoet>=0.44.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
